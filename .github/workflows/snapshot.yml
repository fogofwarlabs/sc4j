name: Snapshot

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      snapshot: ${{ steps.version.outputs.snapshot }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          if [ -z "$version" ]; then
            echo "::error::gradle.properties has no version line."
            exit 1
          fi
          case "$version" in
            *-SNAPSHOT) snapshot=true ;;
            *)          snapshot=false
                        echo "::notice::The version $version is no snapshot; nothing is published." ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"

  # One user package per platform, built and tested on a runner of that platform, kept as a workflow artifact.
  packages:
    name: package (${{ matrix.platform }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # The runners have no GPU, so the OpenGL checks are off; Linux runs the JavaFX tests on a virtual display (Xvfb).
      - name: Test and build the user package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          run_gradle() {
            if [ "$RUNNER_OS" = Linux ]; then
              xvfb-run --auto-servernum ./gradlew "$@"
            else
              ./gradlew "$@"
            fi
          }
          run_gradle test distributionTest -Psc4j.render.smoke=false
          if [ ! -f "build/distributions/SC4J-$VERSION-$PLATFORM.zip" ]; then
            echo "::error::The runner built no SC4J-$VERSION-$PLATFORM.zip."
            exit 1
          fi

      - name: Upload the user package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.platform }}
          path: build/distributions/SC4J-${{ needs.version.outputs.version }}-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.platform }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The Maven Central snapshot, once, after every package was built and tested.
  snapshot:
    name: snapshot
    needs: [version, packages]
    if: needs.version.outputs.snapshot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check the secrets
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          if [ -z "$MAVEN_CENTRAL_USERNAME" ] || [ -z "$MAVEN_CENTRAL_PASSWORD" ]; then
            echo "::error::Set the repository secrets MAVEN_CENTRAL_USERNAME and MAVEN_CENTRAL_PASSWORD (the Central Portal user token)."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Publish the snapshot
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        # An unset secret arrives as an empty variable.
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_signingInMemoryKeyId" ]; then
            unset ORG_GRADLE_PROJECT_signingInMemoryKeyId
          fi
          ./gradlew publishToMavenCentral
