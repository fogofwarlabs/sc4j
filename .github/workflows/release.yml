name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          if [ -z "$version" ]; then
            echo "::error::gradle.properties has no version line."
            exit 1
          fi
          case "$version" in
            *-SNAPSHOT)
              echo "::error::main releases only a release version, not $version: set the version in gradle.properties without -SNAPSHOT."
              exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Refuse an existing tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::The tag $TAG already exists: every release needs a new version in gradle.properties."
            exit 1
          fi

      - name: Check the secrets
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$MAVEN_CENTRAL_USERNAME" ] || [ -z "$MAVEN_CENTRAL_PASSWORD" ]; then
            echo "::error::Set the repository secrets MAVEN_CENTRAL_USERNAME and MAVEN_CENTRAL_PASSWORD (the Central Portal user token)."
            exit 1
          fi
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Set the repository secret SIGNING_KEY: Maven Central takes only signed releases."
            exit 1
          fi

  # One user package per platform, built and tested on a runner of that platform, with its checksum file.
  packages:
    name: package (${{ matrix.platform }})
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # The runners have no GPU, so the OpenGL checks are off; Linux runs the JavaFX tests on a virtual display (Xvfb).
      - name: Test and build the user package
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum ./gradlew test distributionTest -Psc4j.render.smoke=false
          else
            ./gradlew test distributionTest -Psc4j.render.smoke=false
          fi

      # The checksum file has the sha256sum format: the hash, two spaces and the file name.
      - name: Write the checksum file
        env:
          PACKAGE: SC4J-${{ needs.version.outputs.version }}-${{ matrix.platform }}.zip
        run: |
          cd build/distributions
          if [ ! -f "$PACKAGE" ]; then
            echo "::error::The runner built no $PACKAGE."
            exit 1
          fi
          if command -v sha256sum > /dev/null; then
            hash=$(sha256sum "$PACKAGE" | cut -d ' ' -f 1)
          else
            hash=$(shasum -a 256 "$PACKAGE" | cut -d ' ' -f 1)
          fi
          printf '%s  %s\n' "$hash" "$PACKAGE" > "$PACKAGE.sha256"

      - name: Upload the user package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.platform }}
          path: |
            build/distributions/SC4J-${{ needs.version.outputs.version }}-${{ matrix.platform }}.zip
            build/distributions/SC4J-${{ needs.version.outputs.version }}-${{ matrix.platform }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.platform }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Maven Central once, then the tag and the GitHub release with every package and its checksum file.
  release:
    name: release
    needs: [version, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up the JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Download the user packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: packages
          merge-multiple: true

      - name: Check the user packages
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for platform in windows-x64 linux-x64 linux-arm64 macos-arm64; do
            package="packages/SC4J-$VERSION-$platform.zip"
            if [ ! -f "$package" ] || [ ! -f "$package.sha256" ]; then
              echo "::error::The release lacks $package or its checksum file."
              exit 1
            fi
          done
          (cd packages && sha256sum --check --strict -- *.sha256)

      - name: Publish and release
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        # An unset secret arrives as an empty variable.
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_signingInMemoryKeyId" ]; then
            unset ORG_GRADLE_PROJECT_signingInMemoryKeyId
          fi
          ./gradlew publishAndReleaseToMavenCentral

      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The notes list the commits since the previous release tag, without the version changes and the release merges.
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)
          {
            echo "## What's Changed"
            git log --no-merges --format='* %s' "${previous:+$previous..}$GITHUB_SHA" | grep -v '^\* Bump version to ' || true

            if [ -n "$previous" ]; then
              echo
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$TAG"
            fi
          } > release-notes.md

          gh release create "$TAG" packages/SC4J-"$VERSION"-*.zip packages/SC4J-"$VERSION"-*.zip.sha256 --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file release-notes.md
