name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      # Keeps the line endings of the repository on the Windows runner.
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # The runners have no GPU, so the OpenGL checks are off. The launcher tests lay out JavaFX scenes, which need a display: on Linux a
      # virtual one (Xvfb).
      - name: Test the engine
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum ./gradlew test -Psc4j.render.smoke=false
          else
            ./gradlew test -Psc4j.render.smoke=false
          fi

      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.os }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The required status check: it passes only when the tests passed on every system.
  test:
    name: test
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the tests of every system
        env:
          RESULT: ${{ needs.tests.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::The tests did not pass on every system ($RESULT)."
            exit 1
          fi
