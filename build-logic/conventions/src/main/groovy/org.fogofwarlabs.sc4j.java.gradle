// The conventions of the engine build. A project applies it before its Java plugins react.

// The licence files of every distribution: LICENSE, NOTICE and the third-party licence texts of licenses/ that NOTICE names. A
// distribution folder carries all three, a jar LICENSE and NOTICE in META-INF/. checkDistributionLicenses fails when a file is missing,
// when NOTICE does not name a text of licenses/ or names one that does not exist.
def licenseNames = ['LICENSE', 'NOTICE']
def licenseTextFolder = rootProject.file('licenses')
def licenseTextReference = ~/licenses\/[A-Za-z0-9_.-]*[A-Za-z0-9]/
def licenseFiles = rootProject.files(licenseNames)
ext.licenseFiles = licenseFiles
ext.licenseTexts = licenseTextFolder
def checkDistributionLicenses = { File directory ->
    def texts = licenseTextFolder.listFiles().findAll { file -> file.isFile() }.collect { file -> 'licenses/' + file.name }
    def missing = (licenseNames + texts).findAll { path -> !new File(directory, path).isFile() }
    if (!missing.isEmpty()) {
        throw new GradleException('The distribution ' + directory + ' lacks ' + missing.join(', ') + '.')
    }
    def named = (new File(directory, 'NOTICE').getText('UTF-8') =~ licenseTextReference).collect { match -> match }.toSet()
    def problems = []
    def unnamed = texts.findAll { path -> !named.contains(path) }
    if (!unnamed.isEmpty()) {
        problems << 'does not name ' + unnamed.join(', ')
    }
    def unknown = named.findAll { path -> !texts.contains(path) }
    if (!unknown.isEmpty()) {
        problems << 'names the missing ' + unknown.join(', ')
    }
    if (!problems.isEmpty()) {
        throw new GradleException('The NOTICE of ' + directory + ' ' + problems.join(' and ') + '.')
    }
}
ext.checkDistributionLicenses = checkDistributionLicenses

// These options must precede JVM startup: the JDK caches its default temporary directory during initialization.
[Test, JavaExec].each { taskType ->
    tasks.withType(taskType).configureEach { processTask ->
        def temporaryDirectory = layout.buildDirectory.dir("tmp/${processTask.name}-io")
        jvmArgs '-XX:-UsePerfData', '-Djava.io.tmpdir=' + temporaryDirectory.get().asFile.absolutePath
        doFirst {
            def directory = temporaryDirectory.get().asFile
            if (!directory.isDirectory() && !directory.mkdirs()) {
                throw new GradleException("Cannot create the JVM temporary directory: " + directory)
            }
        }
    }
}

// Every jar carries LICENSE and NOTICE in META-INF/. The base jar type org.gradle.jvm.tasks.Jar covers the jars of plugins too (the
// javadoc jar of the publishing plugin), which do not extend the Jar type of the build script. A mod jar gets them from the mod plugin.
tasks.withType(org.gradle.jvm.tasks.Jar).configureEach { task ->
    if (!(task.name == 'jar' && pluginManager.hasPlugin('org.fogofwarlabs.sc4j.mod'))) {
        metaInf {
            from(licenseFiles)
        }
    }
}

plugins.withId('java') {
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }
}

// An application with native libraries loads them from lib/natives; the JavaCPP options serve FFmpeg, the engine's video default.
plugins.withId('application') {
    tasks.named('startScripts') {
        defaultJvmOpts = providers.provider {
            application.applicationDefaultJvmArgs + ['-XX:-UsePerfData', '-Djava.io.tmpdir=APP_HOME_PLACEHOLDER/.cache/tmp'] +
            (project.configurations.findByName('nativeLibraries') != null ? [
                '--enable-native-access=ALL-UNNAMED',
                '-Dorg.lwjgl.librarypath=APP_HOME_PLACEHOLDER/lib/natives',
                '-Djava.library.path=APP_HOME_PLACEHOLDER/lib/natives',
                '-Dorg.lwjgl.system.SharedLibraryExtractPath=APP_HOME_PLACEHOLDER/.cache/natives',
                '-Dorg.bytedeco.javacpp.cachedir=APP_HOME_PLACEHOLDER/.cache/javacpp',
                '-Dorg.bytedeco.javacpp.platform.linkpath=APP_HOME_PLACEHOLDER/lib/natives',
                '-Dorg.bytedeco.javacpp.platform.preloadpath=APP_HOME_PLACEHOLDER/lib/natives',
                '-Dorg.bytedeco.javacpp.pathsFirst=true',
                '-Dorg.bytedeco.javacpp.cacheLibraries=false'
            ] : [])
        }.get()
        doLast {
            def windowsText = windowsScript.text.replace('APP_HOME_PLACEHOLDER', '%APP_HOME%')
            def windowsPreparation = 'if not exist "%APP_HOME%\\.cache\\tmp\\" mkdir "%APP_HOME%\\.cache\\tmp"\r\n' +
                                     'if not exist "%APP_HOME%\\.cache\\tmp\\" (\r\n' +
                                     '    echo ERROR: Cannot create the JVM temporary directory. 1>&2\r\n    exit /b 1\r\n)\r\n\r\n'
            windowsText = windowsText.replace('@rem Add default JVM options here.', windowsPreparation + '@rem Add default JVM options here.')
            windowsText = windowsText.replace('%JAVA_EXE% -version', '%JAVA_EXE% %DEFAULT_JVM_OPTS% -version')
            // The Java runtime of the user package (<install>/java, beside launcher/ and runtime/) comes before JAVA_HOME and PATH.
            def windowsJava = 'if exist "%APP_HOME%\\..\\java\\bin\\java.exe" set "JAVA_HOME=%APP_HOME%\\..\\java"\r\n\r\n'
            windowsText = windowsText.replace('@rem Find java.exe', windowsJava + '@rem Find java.exe')
            windowsScript.text = windowsText
            def unixText = unixScript.text.replace('APP_HOME_PLACEHOLDER', '\'"$APP_HOME"\'')
            def unixPreparation = 'mkdir -p "$APP_HOME/.cache/tmp" || die "Cannot create the JVM temporary directory"\n' +
                                  '[ -d "$APP_HOME/.cache/tmp" ] || die "The JVM temporary path is not a directory"\n\n'
            unixText = unixText.replace('# Add default JVM options here.', unixPreparation + '# Add default JVM options here.')
            def unixJava = 'if [ -x "$APP_HOME/../java/bin/java" ] ; then\n    JAVA_HOME=$APP_HOME/../java\nfi\n\n'
            // The JVM names files in the charset of the locale (sun.jnu.encoding): a C or POSIX locale on Linux gets its UTF-8 variant, which
            // the processes the program starts inherit. macOS always names files in UTF-8.
            def unixLocale = 'case ${LC_ALL:-${LC_CTYPE:-${LANG:-C}}} in\n' +
                             '    C|POSIX) [ "$( uname )" = Darwin ] || export LC_ALL=C.UTF-8 ;;\nesac\n\n'
            unixScript.text = unixText.replace('# Determine the Java command to use to start the JVM.',
                                               unixJava + unixLocale + '# Determine the Java command to use to start the JVM.')
        }
    }
    // Every application distribution carries LICENSE, NOTICE and licenses/ at its root; the install task fails when its folder misses one of
    // them.
    distributions.main.contents {
        from(licenseFiles)
        from(licenseTextFolder) { into 'licenses' }
    }
    tasks.named('installDist', Sync) { task ->
        doLast {
            checkDistributionLicenses(task.destinationDir)
        }
    }
}

plugins.withType(JavaLibraryPlugin).configureEach {
    dependencies {
        testImplementation platform("org.junit:junit-bom:5.11.4")
        testImplementation "org.junit.jupiter:junit-jupiter"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    }

    // javac reports every lint category; javac and javadoc print every warning, without their default limit of 100 per task.
    // Javadoc leaves out the doclint group "missing", which reports getters documented with @return only as "no main description";
    // the style checker checks missing comments and tags. -Psc4j.javadoc.doclint=all restores the full javadoc default.
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-Xlint:all', '-Xmaxwarns', '100000']
    }
    tasks.withType(Javadoc).configureEach {
        options.addBooleanOption('Xdoclint:' + providers.gradleProperty('sc4j.javadoc.doclint').getOrElse('all,-missing'), true)
        options.addStringOption('Xmaxwarns', '100000')
        options.addStringOption('Xmaxerrs', '100000')
        options.tags('apiNote:a:API Note:', 'implSpec:a:Implementation Requirements:')
    }

    tasks.named("test") {
        useJUnitPlatform()
    }
}
