import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import org.fogofwarlabs.sc4j.gradle.mod.ModExtension

import java.util.zip.ZipFile

// A mod of the SC4J engine, declared by the extension sc4jMod (ModExtension).
plugins {
    id 'java-library'
}

// The engine's Java version: its jars and its runtime need it.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

def engineProperties = new Properties()
ModExtension.getResourceAsStream('engine.properties').withReader('UTF-8') { reader -> engineProperties.load(reader) }
def engineGroup = engineProperties.getProperty('group')
def engineVersion = engineProperties.getProperty('version')
def engineApiVersion = engineProperties.getProperty('engineApi')
def manifestFormat = Integer.parseInt(engineProperties.getProperty('manifestFormat'))
def modApiModules = engineProperties.getProperty('modApi').split(',').toList()

def mod = extensions.create('sc4jMod', ModExtension)
def mainSourceSet = sourceSets.main
mod.sourceSets.convention([mainSourceSet])
mod.install.convention(layout.projectDirectory.dir(providers.gradleProperty('sc4j.install')))
mod.licenses.convention(rootProject.files('LICENSE', 'NOTICE').filter { file -> file.isFile() })
def modVersion = provider { project.version.toString() }

// The manifest sc4j-mod.json of the mod's resources gets "version" (the project version) and "engine" (the engine API version of the
// plugin) after its opening brace; the source manifest leaves both out and names a "format" that the plugin's engine reads.
def manifestName = 'sc4j-mod.json'
def modSourceSets = { ([mainSourceSet] + mod.sourceSets.get()).unique { first, second -> first.is(second) ? 0 : 1 } }
def hasModId = { manifest -> manifest instanceof Map && manifest.id instanceof String && !manifest.id.isEmpty() }
// The mod id: sc4jMod.id when set, else the "id" of the source manifest in the resource folders of the mod's source sets.
def readSourceModId = {
    def manifests = modSourceSets().collectMany { sourceSet ->
        sourceSet.resources.srcDirs.collect { directory -> new File(directory, manifestName) }
    }.findAll { file -> file.isFile() }.unique()
    if (manifests.isEmpty()) {
        throw new GradleException('The mod project ' + project.name + ' has no manifest ' + manifestName + ' in its resources.')
    }
    if (manifests.size() > 1) {
        throw new GradleException('The mod project ' + project.name + ' has more than one manifest ' + manifestName + ': ' + manifests.join(', ') +
                                  '.')
    }
    def manifest = new JsonSlurper().parse(manifests.first(), 'UTF-8')
    if (!hasModId(manifest)) {
        throw new GradleException('The manifest ' + manifests.first() + ' has no "id".')
    }
    return manifest.id
}
def modId = mod.id.orElse(provider { readSourceModId() })
def writeManifestVersions = { File manifestFile, String version, String configuredId ->
    if (version == Project.DEFAULT_VERSION) {
        throw new GradleException('The mod project ' + project.name + ' has no version: set version in its build.gradle or gradle.properties.')
    }
    def text = manifestFile.getText('UTF-8')
    def manifest = new JsonSlurper().parseText(text)
    if (!(manifest instanceof Map)) {
        throw new GradleException('The manifest ' + manifestName + ' is not a JSON object.')
    }
    if (!hasModId(manifest)) {
        throw new GradleException('The manifest ' + manifestName + ' has no "id".')
    }
    if (!configuredId.isEmpty() && manifest.id != configuredId) {
        throw new GradleException('The manifest ' + manifestName + ' has the id ' + manifest.id + ' but sc4jMod.id is ' + configuredId + '.')
    }
    if (!manifest.containsKey('format')) {
        throw new GradleException('The manifest ' + manifestName + ' has no "format": set it to ' + manifestFormat + '.')
    }
    if (!(manifest.format instanceof Integer || manifest.format instanceof Long) || manifest.format != manifestFormat) {
        throw new GradleException('The manifest ' + manifestName + ' has the format ' + manifest.format + '; SC4J ' + engineVersion +
                                  ' reads format ' + manifestFormat + '.')
    }
    ['version', 'engine'].each { field ->
        if (manifest.containsKey(field)) {
            throw new GradleException('The manifest ' + manifestName + ' must not have the field "' + field + '": the mod plugin writes it.')
        }
    }
    def start = text.indexOf('{') + 1
    def lineStart = (text.substring(start) =~ /^\r?\n[ \t]*/).with { matcher -> matcher.find() ? matcher.group() : '' }
    def fields = ['"version": ' + JsonOutput.toJson(version), '"engine": ' + JsonOutput.toJson(engineApiVersion)]
    def inserted = fields.collect { field -> lineStart + field + (lineStart.isEmpty() ? ', ' : ',') }.join('')
    manifestFile.setText(text.substring(0, start) + inserted + text.substring(start), 'UTF-8')
}
def configuredModId = mod.id.orElse('')
def engineModule = { String name -> engineGroup + ':' + name + ':' + engineVersion }
// Every source set of the mod, in whichever project owns it, compiles against the mod API; the runtime provides it, so the mod jar does not
// hold it.
afterEvaluate {
    // A source set container finds source sets by name, so the owner of each source set is found by identity.
    modSourceSets().each { sourceSet ->
        def owner = rootProject.allprojects.find { candidate ->
            candidate.extensions.findByType(SourceSetContainer)?.any { candidateSourceSet -> candidateSourceSet.is(sourceSet) }
        }
        modApiModules.each { module -> owner.dependencies.add(sourceSet.implementationConfigurationName, engineModule(module)) }
        owner.tasks.named(sourceSet.processResourcesTaskName, ProcessResources) { task ->
            task.inputs.property('sc4jModVersion', modVersion)
            task.inputs.property('sc4jEngineApiVersion', engineApiVersion)
            task.inputs.property('sc4jModId', configuredModId)
            task.doLast {
                def manifestFile = new File(task.destinationDir, manifestName)
                if (manifestFile.isFile()) {
                    writeManifestVersions(manifestFile, modVersion.get(), configuredModId.get())
                }
            }
        }
    }
}

def javaRuntime = { AttributeContainer attributes ->
    attributes.attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
    attributes.attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
    attributes.attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
    attributes.attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
}

// The mod jar: no file times and a fixed order, so the same sources give the same jar and the same mod identity.
def checkModJar = { File jar, String id, String version, List<String> licenseNames ->
    new ZipFile(jar).withCloseable { archive ->
        def problems = licenseNames.collect { name -> 'META-INF/' + name }.findAll { name -> archive.getEntry(name) == null }.collect { name ->
            'lacks ' + name
        }
        def manifestEntry = archive.getEntry('sc4j-mod.json')
        if (manifestEntry == null) {
            problems << 'lacks the manifest sc4j-mod.json'
        } else {
            def manifest = archive.getInputStream(manifestEntry).withCloseable { input -> new JsonSlurper().parse(input, 'UTF-8') }
            if (manifest.id != id) {
                problems << 'has the mod id ' + manifest.id + ' instead of ' + id + ' in sc4j-mod.json'
            }
            if (manifest.version != version || manifest.engine != engineApiVersion) {
                problems << 'has the version ' + manifest.version + ' and the engine ' + manifest.engine + ' instead of ' + version + ' and ' +
                engineApiVersion + ' in sc4j-mod.json'
            }
            if (!(manifest.entry instanceof String) || archive.getEntry(manifest.entry.replace('.', '/') + '.class') == null) {
                problems << 'lacks the entry class ' + manifest.entry + ' of sc4j-mod.json'
            }
            (manifest.tools instanceof List ? manifest.tools : []).each { tool ->
                if (!(tool instanceof Map) || !(tool.main instanceof String) || archive.getEntry(tool.main.replace('.', '/') + '.class') == null) {
                    problems << 'lacks the tool class ' + (tool instanceof Map ? tool.main : tool) + ' of sc4j-mod.json'
                }
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException('The mod jar ' + jar + ' ' + problems.join(', ') + '.')
        }
    }
}
def jar = tasks.named('jar', Jar) {
    description = 'Builds the mod jar build/libs/<id>.jar.'
    group = 'sc4j'
    archiveFileName = modId.map { id -> id + '.jar' }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    duplicatesStrategy = DuplicatesStrategy.FAIL
    // The java plugin puts the main source set in; the other source sets of the mod join it.
    from({ mod.sourceSets.get().findAll { sourceSet -> !sourceSet.is(mainSourceSet) }.collect { sourceSet -> sourceSet.output } })
    metaInf {
        from(mod.licenses)
    }
    def licenses = mod.licenses
    doLast {
        checkModJar(archiveFile.get().asFile, modId.get(), modVersion.get(), licenses.files.collect { file -> file.name })
    }
}

// The mod jar as the variant of this project with the usage sc4j-mod-jar.
configurations.consumable('modJarElements') {
    attributes.attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, 'sc4j-mod-jar'))
    outgoing.artifact(jar)
}

// The engine runtime of the plugin's version and the native libraries of its LWJGL and JavaCPP libraries for this platform.
def runtime = configurations.dependencyScope('sc4jRuntime')
dependencies.add('sc4jRuntime', engineModule('sc4j-runtime'))
def runtimeClasspath = configurations.resolvable('sc4jRuntimeClasspath') {
    extendsFrom(runtime.get())
    attributes(javaRuntime)
}
def nativeClassifiers = {
    def operatingSystem = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    def arm = System.getProperty('os.arch').toLowerCase(Locale.ROOT) in ['aarch64', 'arm64']
    if (operatingSystem.contains('windows')) {
        return ['org.lwjgl': arm ? 'natives-windows-arm64' : 'natives-windows', 'org.bytedeco': arm ? 'windows-arm64' : 'windows-x86_64']
    }
    if (operatingSystem.contains('linux')) {
        return ['org.lwjgl': arm ? 'natives-linux-arm64' : 'natives-linux', 'org.bytedeco': arm ? 'linux-arm64' : 'linux-x86_64']
    }
    throw new GradleException('The engine runtime has no native libraries for ' + System.getProperty('os.name') + '.')
}
def runtimeNatives = files({
    def classifiers = nativeClassifiers()
    def natives = runtimeClasspath.get().incoming.artifacts.artifacts.collect { artifact -> artifact.id.componentIdentifier }.findAll { component ->
        component instanceof ModuleComponentIdentifier && classifiers.containsKey(component.group)
    }.collect { component ->
        dependencies.create(component.group + ':' + component.module + ':' + component.version + ':' + classifiers[component.group])
    }
    def configuration = configurations.detachedConfiguration(natives as Dependency[])
    configuration.transitive = false
    configuration.attributes(javaRuntime)
    return configuration
})
def runFolder = layout.buildDirectory.dir('sc4j-run')
def nativeFolder = runFolder.get().dir('natives').asFile.absolutePath
def prepareRun = tasks.register('prepareRun', Sync) {
    description = 'Stages the native libraries of the engine runtime for run.'
    from({ runtimeNatives.collect { archive -> zipTree(archive) } }) {
        include '**/*.dll', '**/*.so', '**/*.so.*'
        exclude 'META-INF/**'
        eachFile { details -> details.path = details.name }
        includeEmptyDirs = false
    }
    into nativeFolder
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

// Runs the mod jar in the runtime with the user data of the install, or of build/sc4j-run when no install is set.
tasks.register('run', JavaExec) {
    description = 'Runs the mod jar in the engine runtime (--args passes runtime options, --debug-jvm waits for a debugger).'
    group = 'sc4j'
    dependsOn jar, prepareRun
    classpath = files(runtimeClasspath)
    mainClass = 'org.fogofwarlabs.sc4j.runtime.RuntimeMain'
    def jarFile = jar.flatMap { task -> task.archiveFile }
    def install = mod.install.orElse(runFolder)
    def cacheFolder = runFolder.get().dir('.cache').asFile.absolutePath
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    systemProperty 'org.lwjgl.librarypath', nativeFolder
    systemProperty 'java.library.path', nativeFolder
    systemProperty 'org.lwjgl.system.SharedLibraryExtractPath', cacheFolder + '/natives'
    systemProperty 'org.bytedeco.javacpp.cachedir', cacheFolder + '/javacpp'
    systemProperty 'org.bytedeco.javacpp.platform.linkpath', nativeFolder
    systemProperty 'org.bytedeco.javacpp.platform.preloadpath', nativeFolder
    systemProperty 'org.bytedeco.javacpp.pathsFirst', 'true'
    systemProperty 'org.bytedeco.javacpp.cacheLibraries', 'false'
    // The options of --args follow the mod and the install, so that mod arguments after "--" stay last.
    doFirst {
        args = ['--mod', jarFile.get().asFile.absolutePath, '--install', install.get().asFile.absolutePath] + args
    }
}

// Copies the mod jar into mods/ of the install.
tasks.register('installMod', Copy) {
    description = 'Copies the mod jar into the mods folder of the install (sc4jMod.install).'
    group = 'sc4j'
    into mod.install
    from(jar) { into 'mods' }
}
