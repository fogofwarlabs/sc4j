plugins {
    id 'java-library'
    id 'org.fogofwarlabs.sc4j.java'
    id 'org.fogofwarlabs.sc4j.natives'
}

// The engine client framework: runtime host, scenes, input, the renderer with its OpenGL defaults, text, HUD, dialogs, cursors, skins, the
// world view and audio with its OpenAL default. Of the engine modules only this one uses LWJGL. No network and no mod API.
tasks.withType(Test).configureEach {
    // The OpenGL and GLFW checks of the client defaults open a hidden window; false turns them off.
    systemProperty 'sc4j.render.smoke', providers.gradleProperty('sc4j.render.smoke').getOrElse('false')
}

dependencies {
    api project(':sc4j-engine-sim')

    // The window, its OpenGL context, the OpenGL calls, the OpenAL sound and the Ogg Vorbis decoding (stb_vorbis) of the client defaults.
    implementation platform("org.lwjgl:lwjgl-bom:$LWJGL_VERSION")
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.lwjgl:lwjgl-openal'
    implementation 'org.lwjgl:lwjgl-stb'

    nativeLibraries "org.lwjgl:lwjgl:$LWJGL_VERSION:$LWJGL_NATIVES"
    nativeLibraries "org.lwjgl:lwjgl-glfw:$LWJGL_VERSION:$LWJGL_NATIVES"
    nativeLibraries "org.lwjgl:lwjgl-opengl:$LWJGL_VERSION:$LWJGL_NATIVES"
    nativeLibraries "org.lwjgl:lwjgl-openal:$LWJGL_VERSION:$LWJGL_NATIVES"
    nativeLibraries "org.lwjgl:lwjgl-stb:$LWJGL_VERSION:$LWJGL_NATIVES"

    // The video default (engine.client.video): FFmpeg 7.1 through the bytedeco JavaCPP presets, LGPL build.
    implementation 'org.bytedeco:javacpp:1.5.11'
    implementation 'org.bytedeco:ffmpeg:7.1-1.5.11'
    nativeLibraries "org.bytedeco:javacpp:1.5.11:$OS-$ARCH"
    nativeLibraries "org.bytedeco:ffmpeg:7.1-1.5.11:$OS-$ARCH"

    // The skirmish and lockstep games of the session, view and replay tests (the replay, save and snapshot tests record through a client
    // session, so they run here).
    testImplementation testFixtures(project(':sc4j-engine-sim'))
}
