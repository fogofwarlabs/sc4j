import com.vanniktech.maven.publish.DeploymentValidation
import com.vanniktech.maven.publish.JavaLibrary
import com.vanniktech.maven.publish.JavadocJar
import com.vanniktech.maven.publish.SourcesJar

plugins {
    id 'org.fogofwarlabs.sc4j.java'
    // The Maven Central publishing of the engine modules (the publishing part at the end of this file).
    id 'com.vanniktech.maven.publish' version '0.37.0' apply false
}

def operatingSystem = System.getProperty("os.name").toUpperCase()
def architecture = System.getProperty("os.arch").toUpperCase()

def platformOperatingSystem = ""
def platformArchitecture = ""

if (operatingSystem.contains("WINDOWS")) {
    platformOperatingSystem = "windows"
} else if (operatingSystem.contains("LINUX")) {
    platformOperatingSystem = "linux"
} else {
    throw new GradleException("Not supported operating system.")
}

if (architecture.contains("AMD64") || architecture.contains("X86_64")) {
    platformArchitecture = "x86_64"
} else if (architecture.contains("AARCH64") || architecture.contains("ARM64")) {
    platformArchitecture = "arm64"
} else {
    throw new GradleException("Not supported system architecture.")
}

ext {
    OS = platformOperatingSystem
    ARCH = platformArchitecture

    LWJGL_VERSION = '3.3.6'
    LWJGL_NATIVES = "natives-" + OS + (ARCH == "arm64" ? "-arm64" : "")
}

allprojects {
    group = 'org.fogofwarlabs.sc4j'
    version = "$project.version"

    repositories {
        mavenCentral()
    }
}

// Engine simulation determinism check: the simulation packages of the engine core and simulation modules use no source of
// nondeterminism. Comments, string and character literals are blanked first, so only code is checked. "check" (and so "build") runs it.
def simulationPackages = ['random', 'math', 'game', 'entity', 'state', 'animation', 'content', 'hook', 'movement', 'path', 'collision',
                          'spatial', 'visibility', 'combat', 'economy', 'production', 'order', 'player', 'lifecycle', 'command', 'controller',
                          'trigger', 'computer', 'terrain', 'map', 'projectile', 'lockstep', 'replay', 'save']
def commentsAndLiterals = java.util.regex.Pattern.compile($/(?s)""".*?"""|/\*.*?\*/|//[^\n]*|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'/$)
def forbiddenSimulationApis = [
    'Math.random'                 : ~/\b(Strict)?Math\s*\.\s*random\b/,
    'a clock'                     : ~/\bSystem\s*\.\s*(currentTimeMillis|nanoTime)\b|\bjava\s*\.\s*time\b/,
    'a java.util random generator': ~/\b(Random|SecureRandom|SplittableRandom|ThreadLocalRandom)\b/,
    'a hash-ordered collection'   : ~/\b(HashMap|HashSet|Hashtable|IdentityHashMap|WeakHashMap|ConcurrentHashMap)\b/,
    'an identity hash code'       : ~/\bidentityHashCode\b/,
    'floating point'              : ~/\b(float|double|Float|Double)\b/
]

configure([project(':sc4j-engine-core'), project(':sc4j-engine-sim')]) { module ->
    def simulationFiles = files(simulationPackages.collect { name ->
        fileTree(module.file('src/main/java/org/fogofwarlabs/sc4j/engine/' + name)) { include '**/*.java' }
    })
    def report = module.layout.buildDirectory.file('reports/simulation-determinism.txt')
    def checkSimulationDeterminism = module.tasks.register('checkSimulationDeterminism') {
        description = 'Checks that the engine simulation packages use no Math.random, clock, java.util random generator, hash-ordered ' +
                      'collection, identity hash code or floating point.'
        group = 'verification'
        inputs.files(simulationFiles)
        outputs.file(report)
        doLast {
            def problems = []
            simulationFiles.each { file ->
                def text = file.getText('UTF-8')
                def matcher = commentsAndLiterals.matcher(text)
                def code = new StringBuilder()
                while (matcher.find()) {
                    matcher.appendReplacement(code, java.util.regex.Matcher.quoteReplacement(matcher.group().replaceAll('[^\n]', ' ')))
                }
                matcher.appendTail(code)
                code.toString().split('\n', -1).eachWithIndex { line, index ->
                    forbiddenSimulationApis.each { name, pattern ->
                        if (line =~ pattern) {
                            problems << file.path + ':' + (index + 1) + ': ' + name + ': ' + line.trim()
                        }
                    }
                }
            }
            if (!problems.isEmpty()) {
                throw new GradleException(module.path + ' simulation packages must stay deterministic:\n  ' + problems.join('\n  '))
            }
            report.get().asFile.text = 'No nondeterministic API in the simulation packages: ' + simulationFiles.files.size() + ' files checked.\n'
        }
    }
    module.plugins.withId('java-library') {
        module.tasks.named('check') {
            dependsOn checkSimulationDeterminism
        }
    }
}

// Public API list (docs/api-policy.md): the API of an engine module is every public or protected class, constructor,
// method and field of its main classes outside the internal elements: the packages and classes annotated ApiStatus.Internal, which stay
// public for the engine's own modules and the runtime. apiDump writes it with the JDK's javap to api/<module>.api
// (checked in); apiCheck, which "check" (and so "build") runs, fails when the compiled classes differ from that file. The base and the
// manifest are listed too: mods compile against them through the engine. The catalog is the part of the mod API that a mod declares itself.
def apiModules = ['sc4j-base', 'sc4j-mod-manifest', 'sc4j-engine-core', 'sc4j-engine-sim', 'sc4j-engine-net', 'sc4j-engine-client', 'sc4j-engine',
                  'sc4j-catalog']
def apiToolMainClass = 'org.fogofwarlabs.sc4j.tools.api.ApiTool'
def createApiToolConfiguration = { module ->
    def configuration = module.configurations.create('apiTool') {
        canBeConsumed = false
        canBeResolved = true
    }
    module.dependencies.add('apiTool', module.dependencies.project(path: ':tools:api-check'))
    return configuration
}

// The modules whose test fixtures are published (the testFixtures variants of their component), with the API listing
// api/<module>-test-fixtures.api of the tasks testFixturesApiDump and testFixturesApiCheck; check also builds their Javadoc.
def publishedTestFixtureModules = ['sc4j-mod-manifest', 'sc4j-engine-net', 'sc4j-beaconlink-protocol', 'sc4j-beaconlink']
// The listing file suffix, the task names and the report of each listed source set.
def apiListings = [
    main        : [suffix: '', dump: 'apiDump', check: 'apiCheck', report: 'api-check'],
    testFixtures: [suffix: '-test-fixtures', dump: 'testFixturesApiDump', check: 'testFixturesApiCheck', report: 'test-fixtures-api-check']
]
def registerApiTasks = { module, apiTool, String sourceSetName ->
    def listing = apiListings[sourceSetName]
    def apiFileName = 'api/' + module.name + listing.suffix + '.api'
    def apiFile = module.file(apiFileName)
    def report = module.layout.buildDirectory.file('reports/' + listing.report + '.txt')
    def classes = module.sourceSets.getByName(sourceSetName).output.classesDirs
    def classArguments = { classes.files.sort().collectMany { directory -> ['--classes', directory.absolutePath] } }
    def apiDump = module.tasks.register(listing.dump, JavaExec) {
        description = 'Writes the public API list of the ' + sourceSetName + ' classes of this module (' + apiFileName + ') with javap.'
        group = 'build'
        classpath = apiTool
        mainClass = apiToolMainClass
        inputs.files(classes)
        outputs.file(apiFile)
        argumentProviders.add({ ['dump', '--api-file', apiFile.absolutePath] + classArguments() } as CommandLineArgumentProvider)
    }
    def apiCheck = module.tasks.register(listing.check, JavaExec) {
        description = 'Checks that the public API of the ' + sourceSetName + ' classes of this module equals ' + apiFileName + ' (' + listing.dump +
                      ' updates the file).'
        group = 'verification'
        classpath = apiTool
        mainClass = apiToolMainClass
        mustRunAfter apiDump
        inputs.files(classes)
        inputs.files(apiFile)
        outputs.file(report)
        argumentProviders.add({
            ['check', '--api-file', apiFile.absolutePath] + classArguments() +
            ['--update-task', module.path + ':' + listing.dump, '--report', report.get().asFile.absolutePath]
        } as CommandLineArgumentProvider)
    }
    module.tasks.named('check') {
        dependsOn apiCheck
    }
}

configure((apiModules + publishedTestFixtureModules).unique().collect { name -> project(':' + name) }) { module ->
    def apiTool = createApiToolConfiguration(module)
    if (module.name in apiModules) {
        module.plugins.withId('java-library') {
            registerApiTasks(module, apiTool, SourceSet.MAIN_SOURCE_SET_NAME)
        }
    }
    if (module.name in publishedTestFixtureModules) {
        module.plugins.withId('java-test-fixtures') {
            registerApiTasks(module, apiTool, 'testFixtures')
            module.tasks.named('check') {
                dependsOn 'testFixturesJavadoc'
            }
        }
    }
}

// The Java runtime of the user package: an image of the JDK that runs this build, made with that JDK's own jlink, with the modules that the
// launcher, the runtime and the mods use: what jdeps finds in their jars and in the JavaFX modules (which stay in launcher/lib/javafx), and
// the charsets and locale data they look up by name.
def javaRuntimeModules = ['java.base', 'java.desktop', 'java.management', 'java.net.http', 'java.xml', 'jdk.unsupported', 'jdk.charsets',
                          'jdk.localedata']
// The languages of mod texts.
def javaRuntimeLocales = ['en', 'de', 'es', 'fr', 'it', 'ja', 'ko', 'pl', 'pt', 'ru', 'zh']
def javaRuntimeHome = providers.systemProperty('java.home').get()
def javaRuntimeImage = layout.buildDirectory.dir('java-runtime')

// Runs the tools of the build from task actions.
interface ExecOperationsHolder {
    @javax.inject.Inject
    org.gradle.process.ExecOperations getExecOperations()
}

def execOperations = objects.newInstance(ExecOperationsHolder).execOperations

// On Windows the programs of the user package, SC4J.exe and the java.exe and javaw.exe of its Java runtime, get the UTF-8 active code page in
// their manifest (tools/windows-manifest), so that they start from an install folder whose name has characters outside the ANSI code page.
def windowsManifestTool = configurations.create('windowsManifestTool') {
    canBeConsumed = false
    canBeResolved = true
}
dependencies.add('windowsManifestTool', dependencies.project(path: ':tools:windows-manifest'))
def setUtf8CodePage = { List<File> programs ->
    execOperations.javaexec { spec ->
        spec.classpath = windowsManifestTool
        spec.mainClass = 'org.fogofwarlabs.sc4j.tools.windows.WindowsManifestTool'
        spec.jvmArgs '-XX:-UsePerfData', '--enable-native-access=ALL-UNNAMED'
        spec.args programs.collect { program -> program.absolutePath }
    }
}

def createJavaRuntime = tasks.register('createJavaRuntime', Exec) {
    description = 'Creates the Java runtime image of the user package in build/java-runtime with jlink.'
    group = 'distribution'
    inputs.property('modules', javaRuntimeModules)
    inputs.property('locales', javaRuntimeLocales)
    inputs.property('javaHome', javaRuntimeHome)
    outputs.dir(javaRuntimeImage)
    def imageDirectory = javaRuntimeImage.get().asFile
    executable = new File(javaRuntimeHome, 'bin/' + (platformOperatingSystem == 'windows' ? 'jlink.exe' : 'jlink')).absolutePath
    args '--add-modules', javaRuntimeModules.join(','), '--include-locales=' + javaRuntimeLocales.join(','), '--strip-debug',
        '--no-header-files', '--no-man-pages', '--compress=zip-6', '--output', imageDirectory.absolutePath
    // jlink writes only into a folder that does not exist.
    doFirst {
        imageDirectory.deleteDir()
    }
    if (platformOperatingSystem == 'windows') {
        inputs.files(windowsManifestTool)
        doLast {
            setUtf8CodePage(['java.exe', 'javaw.exe'].collect { name -> new File(imageDirectory, 'bin/' + name) })
        }
    }
}

// Fails when the Java runtime of the user package lacks a JDK module that jdeps finds in the jars of launcher/lib or runtime/lib.
// The launcher and the runtime are evaluated after this project, so their install folders are read only when the task runs.
def javaRuntimePrograms = [':sc4j-launcher', ':sc4j-runtime']
def javaRuntimeProgramJars = { String path ->
    fileTree(new File(project(path).tasks.named('installDist', Sync).get().destinationDir, 'lib')) { include '*.jar' }.files.sort()
}
def checkJavaRuntimeModules = tasks.register('checkJavaRuntimeModules') {
    description = 'Checks that the Java runtime of the user package has every JDK module that the launcher and runtime jars need.'
    group = 'verification'
    dependsOn({ javaRuntimePrograms.collect { path -> project(path).tasks.named('installDist') } })
    inputs.files({ javaRuntimePrograms.collect { path -> javaRuntimeProgramJars(path) } })
    inputs.property('modules', javaRuntimeModules)
    inputs.property('javaHome', javaRuntimeHome)
    def report = layout.buildDirectory.file('reports/java-runtime-modules.txt')
    outputs.file(report)
    doLast {
        def jdeps = java.util.spi.ToolProvider.findFirst('jdeps').orElseThrow {
            new GradleException('The JDK ' + javaRuntimeHome + ' has no jdeps.')
        }
        def lines = []
        def problems = []
        javaRuntimePrograms.each { path ->
            def output = new StringWriter()
            def errors = new StringWriter()
            def arguments = ['--multi-release', JavaVersion.current().majorVersion, '--ignore-missing-deps', '--print-module-deps'] +
                            javaRuntimeProgramJars(path).collect { jar -> jar.absolutePath }
            int status = jdeps.run(new PrintWriter(output, true), new PrintWriter(errors, true), arguments as String[])
            if (status != 0) {
                throw new GradleException('jdeps failed on the jars of ' + path + ' (' + status + '): ' + errors.toString().trim())
            }
            def modules = output.toString().trim().split(',').collect { module -> module.trim() }.findAll { module -> !module.isEmpty() }
            def missing = modules.findAll { module -> !javaRuntimeModules.contains(module) }
            lines << path + ': ' + modules.join(',')
            if (!missing.isEmpty()) {
                problems << path + ' needs ' + missing.join(', ')
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException('The Java runtime of the user package lacks modules: ' + problems.join('; ') +
                                      '. Add them to javaRuntimeModules.')
        }
        report.get().asFile.text = lines.join('\n') + '\n'
    }
}

// The programs of an install: launcher/ (the launcher distribution with the shipped seed list), runtime/ (the runtime distribution with its
// native libraries), LICENSE, NOTICE, licenses/ and the start files SC4J.bat and SC4J. The development install and the user package copy it
// with the jars of the mods below and their list.
// The launcher, the runtime and the mods are evaluated after this project, so the copies name their tasks only when Gradle configures them.
def installContents = copySpec {
    from({ project(':sc4j-launcher').tasks.named('installDist') }) { into 'launcher' }
    from({ project(':sc4j-runtime').tasks.named('installDist') }) { into 'runtime' }
    from(licenseFiles)
    from(licenseTexts) { into 'licenses' }
    from(project(':sc4j-launcher').file('src/package'))
}
def installModProjects = [':mods:demo']
def installModJars = { installModProjects.collect { path -> project(path).tasks.named('jar') } }
// The list launcher/package-mods.txt of the mod jars above, one file name per line: a launcher update replaces, adds and removes only these.
def packageModNames = providers.provider { installModProjects.collect { path -> project(path).tasks.named('jar', Jar).get().archiveFileName.get() } }
def packageModList = tasks.register('writePackageModList') {
    description = 'Writes the list of the mod jars an install ships, build/package-mods/package-mods.txt.'
    group = 'distribution'
    def listFile = layout.buildDirectory.file('package-mods/package-mods.txt')
    inputs.property('jars', packageModNames)
    outputs.file(listFile)
    doLast {
        listFile.get().asFile.setText(packageModNames.get().collect { name -> name + '\n' }.join(''), 'UTF-8')
    }
}

// The development install build/dev-install of the repository: the programs of an install and the mods above. userdata/, the caches and
// the other jars of mods/ (those a mod's installMod copies in) are kept between builds.
def developmentInstall = layout.buildDirectory.dir('dev-install')
def devInstall = tasks.register('devInstall', Sync) {
    description = 'Assembles the development install build/dev-install with the launcher, the runtime and mods/demo.jar.'
    group = 'distribution'
    into developmentInstall
    preserve {
        include 'userdata/**'
        include 'runtime/.cache/**'
        include 'launcher/.cache/**'
        include 'mods/**'
    }
    with installContents
    from(installModJars) { into 'mods' }
    from(packageModList) { into 'launcher' }
    doLast {
        checkDistributionLicenses(developmentInstall.get().asFile)
    }
}

// The mods of this build (mod plugin) install into the development install.
subprojects { module ->
    module.plugins.withId('org.fogofwarlabs.sc4j.mod') {
        module.sc4jMod.install = developmentInstall
        module.tasks.named('installMod') {
            dependsOn devInstall
        }
    }
}

// Runs the runtime of the development install with the mod jar mods/<id>.jar, the id from the Gradle property sc4j.mod (default demo):
// gradlew runDevInstall [-Psc4j.mod=<id>]. It opens the client window unless the arguments end the run first.
tasks.register('runDevInstall', JavaExec) {
    description = 'Runs the runtime of the development install with the mod named by the Gradle property sc4j.mod (default demo).'
    group = 'application'
    dependsOn devInstall
    def runtimeDirectory = developmentInstall.map { directory -> directory.dir('runtime').asFile }
    def modJar = developmentInstall.get().file('mods/' + providers.gradleProperty('sc4j.mod').getOrElse('demo') + '.jar').asFile
    classpath = files({ fileTree(new File(runtimeDirectory.get(), 'lib')) { include '*.jar' } })
    mainClass = 'org.fogofwarlabs.sc4j.runtime.RuntimeMain'
    args '--install', developmentInstall.get().asFile.absolutePath, '--mod', modJar.absolutePath
    doFirst {
        def nativeDirectory = new File(runtimeDirectory.get(), 'lib/natives').absolutePath
        jvmArgs '--enable-native-access=ALL-UNNAMED',
            '-Dorg.lwjgl.librarypath=' + nativeDirectory,
            '-Djava.library.path=' + nativeDirectory,
            '-Dorg.lwjgl.system.SharedLibraryExtractPath=' + new File(runtimeDirectory.get(), '.cache/natives').absolutePath,
            '-Dorg.bytedeco.javacpp.cachedir=' + new File(runtimeDirectory.get(), '.cache/javacpp').absolutePath,
            '-Dorg.bytedeco.javacpp.platform.linkpath=' + nativeDirectory,
            '-Dorg.bytedeco.javacpp.platform.preloadpath=' + nativeDirectory,
            '-Dorg.bytedeco.javacpp.pathsFirst=true',
            '-Dorg.bytedeco.javacpp.cacheLibraries=false'
    }
}

// Opens the launcher of the development install: gradlew runDevLauncher. It lists the jars of build/dev-install/mods and starts the
// runtime of the development install.
tasks.register('runDevLauncher', Exec) {
    description = 'Opens the launcher of the development install.'
    group = 'application'
    dependsOn devInstall
    def scriptName = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? 'sc4j-launcher.bat' : 'sc4j-launcher'
    executable = developmentInstall.get().file('launcher/bin/' + scriptName).asFile.absolutePath
}

// A broken test mod for checking the launcher's error display: gradlew devInstallBrokenMod copies broken-test.jar (a manifest without
// "entry" and with an invalid "engine") into build/dev-install/mods. It is never installed by default; delete
// build/dev-install/mods/broken-test.jar to remove it.
def brokenModManifest = resources.text.fromString("""{
  "format": 1,
  "id": "broken-test",
  "name": {"en": "Broken Test Mod", "ko": "깨진 테스트 모드"},
  "version": "0.0.1",
  "engine": "one",
  "description": {"en": "A deliberately broken mod for checking the launcher."}
}
""")

def brokenModJar = tasks.register('brokenModJar', Jar) {
    description = 'Builds the broken test mod jar broken-test.jar.'
    group = 'build'
    archiveFileName = 'broken-test.jar'
    destinationDirectory = layout.buildDirectory.dir('broken-mod')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(brokenModManifest.asFile('UTF-8')) {
        rename { name -> 'sc4j-mod.json' }
    }
}

tasks.register('devInstallBrokenMod', Copy) {
    description = 'Copies the broken test mod broken-test.jar into the development install.'
    group = 'distribution'
    dependsOn devInstall
    from(brokenModJar)
    into developmentInstall.map { directory -> directory.dir('mods') }
}

// The start program SC4J.exe of the Windows user package and its icon. jpackage makes the program, which starts the launcher without a
// console window; its configuration app/SC4J.cfg names the Java runtime java/, the jars of launcher/lib and the JVM options of the launcher's
// start scripts, so the copies of the runtime and the jar that jpackage puts beside it are removed.
def windowsIconSizes = [16, 20, 24, 32, 40, 48, 64, 128, 256]
def windowsIconSource = file('docs/branding/sc4j-logo-512.png')
def windowsIcon = layout.buildDirectory.file('windows-icon/SC4J.ico')
def windowsProgramName = 'SC4J'
def windowsProgramImage = layout.buildDirectory.dir('windows-program/' + windowsProgramName)
// Halves the image with bilinear filtering until one step reaches the size, which keeps the small sizes sharp.
def scaleIconImage = { java.awt.image.BufferedImage source, int size ->
    def image = source
    while (image.width != size) {
        int next = Math.max(size, image.width.intdiv(2))
        def scaled = new java.awt.image.BufferedImage(next, next, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def graphics = scaled.createGraphics()
        graphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BILINEAR)
        graphics.drawImage(image, 0, 0, next, next, null)
        graphics.dispose()
        image = scaled
    }
    return image
}
// An ICO image: PNG at 256 pixels, below that a 32-bit bottom-up BGRA bitmap (header height doubled) and its mask, 1 for transparent.
def encodeIconImage = { java.awt.image.BufferedImage image ->
    int size = image.width
    if (size >= 256) {
        def output = new ByteArrayOutputStream()
        javax.imageio.ImageIO.write(image, 'png', output)
        return output.toByteArray()
    }
    int maskRowLength = (size + 31).intdiv(32) * 4
    int dataLength = size * size * 4 + maskRowLength * size
    def bitmap = java.nio.ByteBuffer.allocate(40 + dataLength).order(java.nio.ByteOrder.LITTLE_ENDIAN)
    bitmap.putInt(40).putInt(size).putInt(2 * size).putShort(1 as short).putShort(32 as short).putInt(0).putInt(dataLength)
    bitmap.putInt(0).putInt(0).putInt(0).putInt(0)
    for (int y = size - 1; y >= 0; y--) {
        for (int x = 0; x < size; x++) {
            bitmap.putInt(image.getRGB(x, y))
        }
    }
    for (int y = size - 1; y >= 0; y--) {
        def row = new byte[maskRowLength]
        for (int x = 0; x < size; x++) {
            if ((image.getRGB(x, y) >>> 24) == 0) {
                row[x.intdiv(8)] = (row[x.intdiv(8)] | (0x80 >> (x % 8))) as byte
            }
        }
        bitmap.put(row)
    }
    return bitmap.array()
}
def createWindowsIcon = tasks.register('createWindowsIcon') {
    description = 'Creates the icon of SC4J.exe, build/windows-icon/SC4J.ico, from the SC4J logo.'
    group = 'distribution'
    inputs.file(windowsIconSource)
    inputs.property('sizes', windowsIconSizes)
    outputs.file(windowsIcon)
    doLast {
        def logo = javax.imageio.ImageIO.read(windowsIconSource)
        def images = windowsIconSizes.collect { size -> encodeIconImage(scaleIconImage(logo, size)) }
        // ICO: a header and one 16-byte directory entry per image, little-endian, followed by the images; width 0 means 256.
        def header = java.nio.ByteBuffer.allocate(6 + 16 * images.size()).order(java.nio.ByteOrder.LITTLE_ENDIAN)
        header.putShort(0 as short).putShort(1 as short).putShort(images.size() as short)
        int offset = header.capacity()
        windowsIconSizes.eachWithIndex { size, index ->
            header.put((size & 0xFF) as byte).put((size & 0xFF) as byte).put(0 as byte).put(0 as byte)
            header.putShort(1 as short).putShort(32 as short).putInt(images[index].length).putInt(offset)
            offset += images[index].length
        }
        windowsIcon.get().asFile.withOutputStream { stream ->
            stream.write(header.array())
            images.each { image -> stream.write(image) }
        }
    }
}
// The launcher is evaluated after this project, so these read its jar, start script options and main class only when the task runs.
def launcherJarTask = { project(':sc4j-launcher').tasks.named('jar') }
def launcherJar = { launcherJarTask().get().archiveFile.get().asFile }
def launcherJvmOptions = providers.provider {
    project(':sc4j-launcher').tasks.named('startScripts').get().defaultJvmOpts.collect { option ->
        option.replace('APP_HOME_PLACEHOLDER', '$ROOTDIR\\launcher')
    }
}
def launcherMainClass = providers.provider { project(':sc4j-launcher').application.mainClass.get() }
def deleteFiles = { Object... paths -> delete(paths) }
def createWindowsProgram = tasks.register('createWindowsProgram', Exec) {
    description = 'Creates the start program SC4J.exe of the Windows user package with its configuration in build/windows-program/SC4J.'
    group = 'distribution'
    def inputDirectory = new File(temporaryDir, 'input')
    def imageDirectory = windowsProgramImage.get().asFile
    inputs.files(createWindowsIcon)
    inputs.files(createJavaRuntime)
    inputs.files(windowsManifestTool)
    inputs.files(launcherJarTask)
    inputs.property('jvmOptions', launcherJvmOptions)
    inputs.property('mainClass', launcherMainClass)
    inputs.property('version', version.toString())
    outputs.dir(imageDirectory)
    executable = new File(javaRuntimeHome, 'bin/jpackage.exe').absolutePath
    // jpackage takes a version of numbers only.
    argumentProviders.add({
        ['--type', 'app-image', '--name', windowsProgramName, '--dest', imageDirectory.parentFile.absolutePath,
         '--input', inputDirectory.absolutePath, '--main-jar', launcherJar().name, '--main-class', launcherMainClass.get(),
         '--runtime-image', javaRuntimeImage.get().asFile.absolutePath, '--icon', windowsIcon.get().asFile.absolutePath,
         '--app-version', version.toString().replaceFirst(/-.*/, ''), '--vendor', 'Fog of War Labs', '--description', 'SC4J']
    } as CommandLineArgumentProvider)
    // jpackage writes only into a folder that does not exist.
    doFirst {
        deleteFiles(imageDirectory, inputDirectory)
        inputDirectory.mkdirs()
        java.nio.file.Files.copy(launcherJar().toPath(), new File(inputDirectory, launcherJar().name).toPath())
    }
    doLast {
        new File(imageDirectory, 'runtime').deleteDir()
        new File(imageDirectory, 'app').deleteDir()
        // jpackage leaves the program read-only, which would stop an update from deleting the replaced one.
        new File(imageDirectory, windowsProgramName + '.exe').setWritable(true)
        setUtf8CodePage([new File(imageDirectory, windowsProgramName + '.exe')])
        def lines = ['[Application]', 'app.runtime=$ROOTDIR\\java', 'app.classpath=$ROOTDIR\\launcher\\lib\\*',
                     'app.mainclass=' + launcherMainClass.get(), '', '[JavaOptions]'] +
                    launcherJvmOptions.get().collect { option -> 'java-options=' + option }
        def configuration = new File(imageDirectory, 'app/' + windowsProgramName + '.cfg')
        configuration.parentFile.mkdirs()
        configuration.setText(lines.join('\n') + '\n', 'UTF-8')
    }
}

// The user package build/distributions/SC4J-<version>.zip: one folder SC4J-<version> with the programs of an install and the jars of the
// mods above in mods/ and the Java runtime that the start scripts and SC4J.exe use (java/); on Windows also SC4J.exe with app/. It holds no
// userdata/ and no cache file: a fresh install makes them at its first start. It holds the empty JVM temporary folder of the launcher
// (launcher/.cache/tmp), which the JVM of SC4J.exe expects at its start.
// The package is staged in build/user-package first, where the licence check runs, and zipped without file times in a fixed order, so that
// the same sources give the same zip.
def userPackageName = 'SC4J-' + version
def launcherTemporaryOption = '-Djava.io.tmpdir=APP_HOME_PLACEHOLDER/'
def launcherTemporaryFolder = providers.provider {
    def option = project(':sc4j-launcher').tasks.named('startScripts').get().defaultJvmOpts.find { option ->
        option.startsWith(launcherTemporaryOption)
    }
    if (option == null) {
        throw new GradleException('The launcher start scripts name no java.io.tmpdir below the launcher folder.')
    }
    return 'launcher/' + option.substring(launcherTemporaryOption.length())
}
def stageUserPackage = tasks.register('stageUserPackage', Sync) {
    description = 'Stages the user package in build/user-package/' + userPackageName + ' and checks its licence files.'
    group = 'distribution'
    into layout.buildDirectory.dir('user-package/' + userPackageName)
    with installContents
    from(installModJars) { into 'mods' }
    from(packageModList) { into 'launcher' }
    from(createJavaRuntime) { into 'java' }
    if (platformOperatingSystem == 'windows') {
        from(createWindowsProgram)
    }
    inputs.property('launcherTemporaryFolder', launcherTemporaryFolder)
    dependsOn checkJavaRuntimeModules
    doLast {
        def temporaryFolder = new File(destinationDir, launcherTemporaryFolder.get())
        if (!temporaryFolder.isDirectory() && !temporaryFolder.mkdirs()) {
            throw new GradleException('Cannot create the folder ' + temporaryFolder + '.')
        }
        checkDistributionLicenses(destinationDir)
    }
}
tasks.register('distribution', Zip) {
    description = 'Builds the user package build/distributions/' + userPackageName + '.zip from the staged package.'
    group = 'distribution'
    archiveFileName = userPackageName + '.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from(stageUserPackage) {
        into userPackageName
        // The start file, the start scripts and the programs of the Java runtime, with the helpers its process start runs.
        filesMatching(['**/bin/*', 'SC4J', 'java/lib/jspawnhelper', 'java/lib/jexec']) { details ->
            details.permissions {
                unix('rwxr-xr-x')
            }
        }
    }
}

// The modules published to Maven Central as org.fogofwarlabs.sc4j:<module>:<version>, with their POM descriptions.
def publishedModules = [
    'sc4j-base'               : 'Generic base of the SC4J engine and its mods: exceptions, logging, binary and JSON helpers and small utilities.',
    'sc4j-mod-manifest'       : 'SC4J mod manifest (sc4j-mod.json), its settings schema and the settings value files.',
    'sc4j-engine-core'        : 'SC4J engine core: fixed-point math, the map grid, terrain, players, the state hash, content identities and ' +
                                'resource models.',
    'sc4j-engine-sim'         : 'SC4J engine simulation: games, units, default systems, content, orders, commands, computer players, triggers, ' +
                                'maps, lockstep, replays and saves.',
    'sc4j-engine-net'         : 'SC4J engine network layer: datagram links, the lockstep transport, LAN room discovery and the network lobby.',
    'sc4j-engine-client'      : 'SC4J engine client framework: runtime host, scenes, input, renderer, text, HUD, dialogs, world view and audio.',
    'sc4j-engine'             : 'SC4J engine that mods compile against: the mod API and the client application over the engine modules.',
    'sc4j-beaconlink-protocol': 'Beacon.Link wire protocol of SC4J: identities, the wire reader and writer, signed rooms and messages.',
    'sc4j-beaconlink-peer'    : 'Beacon.Link peer library of SC4J: the node roles that the launcher, the runtime and the node program run.',
    'sc4j-beaconlink'         : 'Beacon.Link client of SC4J: node sessions, rooms, participant channels and the overlay that a mod plays over.',
    'sc4j-catalog'            : 'SC4J catalog reader: GitHub releases, release versions, the check for a newer release and the mod catalog.',
    'sc4j-runtime'            : 'SC4J runtime: reads a mod jar, loads the mod in its own class loader and runs it in a window or headless.'
]
// Inside this build the coordinates of the published modules (as the mod plugin names them) resolve to their projects.
allprojects {
    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            publishedModules.keySet().each { artifactId ->
                substitute(module('org.fogofwarlabs.sc4j:' + artifactId)).using(project(':' + artifactId))
            }
        }
    }
}

// The mod plugin (build-logic) is published with the modules.
['publishToMavenLocal', 'publishToMavenCentral', 'publishAndReleaseToMavenCentral'].each { taskName ->
    tasks.register(taskName) {
        description = 'Runs ' + taskName + ' of the mod plugin.'
        group = 'publishing'
        dependsOn gradle.includedBuild('build-logic').task(':sc4j-mod-plugin:' + taskName)
    }
}
// The values of every POM: the project, its licence and the organization as its developer.
def projectUrl = 'https://github.com/fogofwarlabs/sc4j'
def projectLicense = [name: 'Apache-2.0', url: 'https://www.apache.org/licenses/LICENSE-2.0.txt']
def projectDeveloper = [id: 'fogofwarlabs', name: 'Fog of War Labs', url: 'https://fogofwarlabs.org']
def projectScm = [url: projectUrl, connection: 'scm:git:' + projectUrl + '.git', developerConnection: 'scm:git:ssh://git@github.com/fogofwarlabs/sc4j.git']

def centralAutomaticRelease = true
def centralDeploymentValidation = DeploymentValidation.VALIDATED
// A blank key counts as none.
def signingKey = providers.gradleProperty('signingInMemoryKey').filter { key -> !key.isBlank() }
// The variants of the test fixtures plugin, left out of the published component of the modules outside publishedTestFixtureModules.
def testFixtureVariants = ['testFixturesApiElements', 'testFixturesRuntimeElements', 'testFixturesSourcesElements', 'testFixturesJavadocElements']

publishedModules.each { artifactId, moduleDescription ->
    project(':' + artifactId) { module ->
        module.apply plugin: 'com.vanniktech.maven.publish'
        module.plugins.withId('java-library') {
            module.mavenPublishing {
                configure(new JavaLibrary(new JavadocJar.Javadoc(), new SourcesJar.Sources()))
                coordinates(module.group.toString(), artifactId, module.version.toString())
                publishToMavenCentral(centralAutomaticRelease, centralDeploymentValidation)
                // publishToMavenLocal works without a key.
                if (signingKey.isPresent()) {
                    signAllPublications()
                }
                pom {
                    name = artifactId
                    description = moduleDescription
                    url = projectUrl
                    licenses {
                        license {
                            name = projectLicense.name
                            url = projectLicense.url
                        }
                    }
                    developers {
                        developer {
                            id = projectDeveloper.id
                            name = projectDeveloper.name
                            url = projectDeveloper.url
                        }
                    }
                    scm {
                        url = projectScm.url
                        connection = projectScm.connection
                        developerConnection = projectScm.developerConnection
                    }
                }
            }
            // The POM and the module metadata name the resolved versions, also of the dependencies a platform manages.
            module.publishing.publications.withType(MavenPublication).configureEach {
                versionMapping {
                    allVariants {
                        fromResolutionResult()
                    }
                }
            }
        }
        module.plugins.withId('java-test-fixtures') {
            if (module.name in publishedTestFixtureModules) {
                return
            }
            module.afterEvaluate {
                testFixtureVariants.findAll { name -> module.configurations.findByName(name) != null }.each { name ->
                    module.components.java.withVariantsFromConfiguration(module.configurations.getByName(name)) { variant ->
                        variant.skip()
                    }
                }
            }
        }
    }
}