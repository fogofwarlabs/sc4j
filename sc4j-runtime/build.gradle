plugins {
    id 'java-library'
    id 'application'
    id 'org.fogofwarlabs.sc4j.java'
    id 'org.fogofwarlabs.sc4j.natives'
}

// The engine executable: it reads a mod jar's manifest and settings, loads the mod in its own class loader and runs it.
// It never depends on a mod module; a mod reaches it only as a jar named on the command line.
dependencies {
    implementation project(':sc4j-engine')
    // The Beacon.Link client behind the engine's Beacon.Link interface of the launch request; it opens nothing until a mod asks.
    implementation project(':sc4j-beaconlink')
    // The catalog reader (releases and the mod catalog) that a mod may use; the runtime ships it once on the class path the mod class
    // loaders see, so mod jars do not hold it.
    runtimeOnly project(':sc4j-catalog')

    // The native libraries of the engine client (LWJGL, FFmpeg through JavaCPP) for lib/natives of the distribution.
    nativeLibraries project(path: ':sc4j-engine-client', configuration: 'nativeLibraries')

    // Test mod jars (org.fogofwarlabs.sc4j.manifest.test.TestJarUtils).
    testImplementation testFixtures(project(':sc4j-mod-manifest'))
}

application {
    applicationName = 'sc4j-runtime'
    mainClass = 'org.fogofwarlabs.sc4j.runtime.RuntimeMain'
}

// The start scripts put every jar of lib/ on the class path. bin/sc4j-runtime.launch holds their Java arguments, one per line, with
// ${APP_HOME} for the distribution folder.
tasks.named('startScripts') {
    doLast {
        windowsScript.text = windowsScript.text.replaceFirst(/(?m)^set CLASSPATH=.*$/, 'set CLASSPATH=%APP_HOME%\\\\lib\\\\*')
        unixScript.text = unixScript.text.replaceFirst(/(?m)^CLASSPATH=.*$/, 'CLASSPATH=\\$APP_HOME/lib/*')
        def launchArguments = defaultJvmOpts.collect { it.replace('APP_HOME_PLACEHOLDER', '${APP_HOME}') } +
                              ['-cp', '${APP_HOME}/lib/*', mainClass.get()]
        new File(outputDir, applicationName + '.launch').setText(launchArguments.join('\n') + '\n', 'UTF-8')
    }
}

// The test of the user package (@RequiresDistribution, tag distribution) unpacks build/distributions/SC4J-<version>.zip, which the root
// project's distribution task builds, and starts its runtime: it runs only in its own task, never in test or check.
tasks.named('test') {
    options {
        excludeTags 'distribution'
    }
}

def distribution = rootProject.tasks.named('distribution')
tasks.register('distributionTest', Test) {
    description = 'Runs the tests of the user package (@RequiresDistribution): it is unpacked and its runtime started headless.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'distribution'
    }
    dependsOn distribution
    inputs.files(distribution)
    jvmArgumentProviders.add({
        ['-Dsc4j.distribution=' + distribution.get().archiveFile.get().asFile.absolutePath]
    } as CommandLineArgumentProvider)
    shouldRunAfter tasks.named('test')
}