pluginManagement {
    // The mod plugin and the conventions of this build (org.fogofwarlabs.sc4j.*).
    includeBuild('build-logic')
}

rootProject.name = "sc4j"

// Engine-side modules: the repository root holds only these.
include 'sc4j-base'
include 'sc4j-mod-manifest'
// The engine modules: core (leaf models), sim (simulation), net (network layer), client (client framework), and sc4j-engine
// (the mod API and the client application) that mods compile against.
include 'sc4j-engine-core'
include 'sc4j-engine-sim'
include 'sc4j-engine-net'
include 'sc4j-engine-client'
include 'sc4j-engine'
include 'sc4j-runtime'
include 'sc4j-launcher'
// The local channel between the launcher and the runtimes it starts: connection, token, frames and named services (no engine).
include 'sc4j-launcher-link'
// The reader of what is published (SC4J releases and the mod catalog) that the launcher and the runtime share (no engine).
include 'sc4j-catalog'
// Beacon.Link: the wire protocol shared by the peers and the client, the peer library that the launcher, the runtime and the
// node executable run, and the node executable (no engine).
include 'sc4j-beaconlink-protocol'
include 'sc4j-beaconlink-peer'
include 'sc4j-beaconlink-node'
// The Beacon.Link client that the runtime gives a mod, with the loopback NAT emulator of the network tests (test fixtures).
include 'sc4j-beaconlink'
// Chat translation: the contract that every side sees (no implementation), and the service behind it: model presets and their
// installation, the SentencePiece tokenizer, the CTranslate2 sequence model, the llama.cpp text generator and the fastText language
// identifier, the worker with its batches and cache (no engine).
include 'sc4j-translate'
include 'sc4j-translate-service'

// The demo, a mod made only of the engine: one module in mods/demo/ (project :mods:demo).
include ':mods:demo'

// The API tools of the engine (apiDump, apiCheck; docs/api-policy.md).
include ':tools:api-check'
// The UTF-8 code page of the Windows programs of the user package.
include ':tools:windows-manifest'
