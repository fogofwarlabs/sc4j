about.privacy.address=함께 플레이하는 플레이어는 내 IP 주소를 볼 수 있습니다. "다른 플레이어 연결 돕기"가 켜져 있고 UDP 포트에 접속할 수 있으면 누구나 볼 수 있습니다.
