about.privacy.files=계정, 친구, 차단 목록, 알려진 피어, 노드 설정은 이 설치 폴더의 userdata/beaconlink에 저장됩니다. 이 PC가 전달하는 방, 채팅, 상태는 메모리에만 남습니다.
